spring.application.name=student-service

# Toda esta seccion se resuelve desde el archivo .env (via spring-dotenv) o desde
# variables de entorno reales del sistema/contenedor. Nada queda escrito aqui.
server.port=${SERVER_PORT}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Simulacion de lentitud del modulo (ver SlowResponseFilter).
# Por defecto esta apagada; se activa desde .env sin recompilar.
simulation.delay.enabled=${SIMULATED_DELAY_ENABLED:false}
simulation.delay.ms=${SIMULATED_DELAY_MS:5000}
simulation.delay.jitter-ms=${SIMULATED_DELAY_JITTER_MS:0}

# Taller 1: endpoint de salud para el healthcheck de Docker y cierre ordenado (SIGTERM)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
